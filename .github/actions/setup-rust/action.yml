name: setup-rust
description: Install the toolchain pinned in rust-toolchain.toml (single source of truth)
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    # Pinned to the current tip of the default branch (the repository publishes no releases).
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: rustfmt, clippy, llvm-tools-preview
