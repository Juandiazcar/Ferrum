# Supply-chain audit (docs/06 §6): RustSec advisories and license check, daily and on lockfile changes.
# Actions are pinned by commit SHA with the release in a comment (docs/10 §6).
name: audit

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths: ["Cargo.lock", "deny.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["Cargo.lock", "deny.toml", ".github/workflows/audit.yml"]

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit --deny warnings
      - run: cargo deny check advisories licenses
