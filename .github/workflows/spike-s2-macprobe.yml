# TEMPORARY (spike S2): finds the exact-bytes form of `footprint` on macOS. Deleted with spike-s2.yml.
name: spike-s2-macprobe

on:
  push:
    branches: [spike/s2-*]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: footprint variants
        shell: bash
        run: |
          sw_vers || true
          cd spikes/s2-allocator
          cargo build --release 2>&1 | tail -1
          ./target/release/ferrum-spike-s2 --idle-secs 2 --hold-secs 90 > o.txt &
          for _ in $(seq 1 120); do grep -q STEADY o.txt 2>/dev/null && break; sleep 0.5; done
          pid=$(grep -o 'pid=[0-9]*' o.txt | cut -d= -f2)
          echo "--- footprint --help"; footprint --help 2>&1 | head -60 || true
          echo "--- footprint -f bytes"; footprint -f bytes "$pid" 2>&1 | head -40 || true
          echo "--- footprint -j"; footprint -j fp.json "$pid" 2>&1 | tail -3 || true; grep -o "\"[a-z_ ]*footprint[a-z_ ]*\":[^,]*" fp.json || true
          echo "--- vmmap --summary"; vmmap --summary "$pid" 2>&1 | tail -25 || true
          kill "$pid" || true
          true
