# TEMPORARY (spike S2, docs/12): runs the allocator comparison on all three OS. Exists only on
# branch spike/s2-allocator and is deleted in the final commit of the PR; results go to ADR 0016.
name: spike-s2

on:
  push:
    branches: [spike/s2-*]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Runner details
        shell: bash
        run: |
          uname -a
          rustc -Vv | sed -n 1,3p
          case "$(uname -s)" in
            Linux*) cat /sys/kernel/mm/transparent_hugepage/enabled; nproc; grep -m1 'model name' /proc/cpuinfo; ldd --version | sed -n 1p; free -m ;;
            Darwin*) sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize || true; sw_vers ;;
          esac
          true
      - name: Allocator comparison (3 runs per configuration)
        shell: bash
        run: bash spikes/s2-allocator/run-all.sh 3 2>&1 | grep -v '^ *\(Compiling\|Checking\|Locking\|Updating\|Downloaded\|Downloading\)' | tee results.txt
      - name: Raw probe output
        if: always()
        shell: bash
        run: |
          cd spikes/s2-allocator/target/results
          for f in *.footprint.txt *.probe.txt *.smaps_rollup *.out; do
            [ -f "$f" ] && { echo "=== $f"; cat "$f"; }
          done
          true
