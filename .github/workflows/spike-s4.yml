# TEMPORARY (spike S4, docs/12): runs the PTY harness on all three OSes. Exists only on the spike
# branch and is deleted in the branch's last commit; it never reaches main.
name: spike-s4

on:
  push:
    branches: [spike/s4-*]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Environment
        shell: bash
        run: |
          uname -a || true
          rustc -V
          command -v pwsh || echo "pwsh: not found"
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' || true
          cmd.exe /c ver || true
      - name: Build harness
        shell: bash
        working-directory: spikes/s4-windows-pty
        run: cargo build --release --locked
      - name: Run harness
        shell: bash
        working-directory: spikes/s4-windows-pty
        env:
          S4_FLOOD_MB: "64"
        run: ./target/release/s4-windows-pty all
      - name: Dependency footprint
        shell: bash
        working-directory: spikes/s4-windows-pty
        run: |
          cargo tree -p portable-pty -e normal --locked | wc -l
          cargo tree -p portable-pty -e normal --locked
