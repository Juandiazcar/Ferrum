# Workspace root manifest — template for WP-00.
# Versions come from docs/07 (verified 2026-11-20). Re-verify on crates.io before use.

[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Throwaway spikes (docs/12) are standalone packages and never part of the product workspace.
exclude = ["spikes", "crates/ferrum-scrollback/fuzz", "crates/ferrum-vt/fuzz", "crates/ferrum-config/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Juandiazcar/ferrum"
publish = false

# ───────────────────────── dependencies (single source of versions) ─────────────────────────
[workspace.dependencies]
# internal. Each entry carries the workspace version: cargo-deny's wildcard ban rejects path-only entries.
# `cargo xtask release prepare` (WP-18) must bump these together with [workspace.package].version.
ferrum-vt         = { path = "crates/ferrum-vt", version = "0.1.0" }
ferrum-scrollback = { path = "crates/ferrum-scrollback", version = "0.1.0" }
ferrum-proto      = { path = "crates/ferrum-proto", version = "0.1.0" }
ferrum-pty        = { path = "crates/ferrum-pty", version = "0.1.0" }
ferrum-daemon     = { path = "crates/ferrum-daemon", version = "0.1.0" }
ferrum-render     = { path = "crates/ferrum-render", version = "0.1.0" }
ferrum-ui         = { path = "crates/ferrum-ui", version = "0.1.0" }
ferrum-config     = { path = "crates/ferrum-config", version = "0.1.0" }
ferrum-project    = { path = "crates/ferrum-project", version = "0.1.0" }
ferrum-platform   = { path = "crates/ferrum-platform", version = "0.1.0" }
ferrum-testkit    = { path = "crates/ferrum-testkit", version = "0.1.0" }

# windowing & rendering
winit             = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer        = { version = "0.4.8", default-features = false, features = ["x11", "wayland"] }
tiny-skia         = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
swash             = "0.2.10"
fontdb            = { version = "0.24.0", default-features = false, features = ["std", "fs", "memmap"] }

# terminal
vte               = { version = "0.15.0", default-features = false }
unicode-width     = { version = "0.2.3", default-features = false }
unicode-segmentation = { version = "1.13.3", default-features = false }
portable-pty      = { version = "0.9.0", default-features = false }
windows-sys       = { version = "0.61.2", default-features = false }
mio               = { version = "1.2.5", default-features = false, features = ["os-poll", "os-ext", "net"] }
rustix            = { version = "1.1.6", default-features = false, features = ["std", "termios", "pty", "process", "fs", "event", "stdio"] }
interprocess      = "2.4.9"
terminal_size     = { version = "0.4.4", default-features = false }  # ferrum-testkit only: the PTY helper reads its size

# data
serde             = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
postcard          = { version = "1.1.3", default-features = false, features = ["use-std"] }
toml              = { version = "1.2.2", default-features = false, features = ["std", "serde", "parse", "display"] }
lz4_flex          = { version = "0.14.2", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
memmap2           = "0.9.12"
memchr            = { version = "2.8.3", default-features = false, features = ["std"] }
bytemuck          = { version = "1.25.2", features = ["derive"] }
smallvec          = "1.16.6"
rustc-hash        = { version = "2.1.3", default-features = false, features = ["std"] }
bitflags          = { version = "2.13.2", default-features = false }
base64            = { version = "0.23.1", default-features = false, features = ["std"] }
tar               = { version = "0.4.46", default-features = false }
zstd              = "0.14.4"
csscolorparser    = "0.9.2"
directories       = "6.0.0"
arboard           = { version = "3.7.0", default-features = false }
image             = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# app glue
lexopt            = "0.3.2"
clap              = { version = "4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }  # xtask only (docs/07)
cargo_metadata    = "0.23.1"                                                                                                       # xtask only (check-deps)
serde_json        = { version = "1.0.154", default-features = false, features = ["std"] }                                      # xtask only (bench baselines)
thiserror         = { version = "2.0.21", default-features = false, features = ["std"] }
anyhow            = "1.0.104"
tracing           = { version = "0.1.44", default-features = false, features = ["std", "release_max_level_warn"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

# dev
criterion         = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest          = { version = "1.12.0", default-features = false, features = ["std"] }
insta             = { version = "1.49.0", default-features = false }
dhat              = { version = "0.3.3", default-features = false }

# ───────────────────────── lints ─────────────────────────
[workspace.lints.rust]
unsafe_code = "forbid"           # overridden to "deny" only in ferrum-pty, ferrum-platform, ferrum-render (see docs/05 §4)
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
let_underscore_drop = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.cargo]
# The dependency table is the single source of versions (docs/04 §3) and is filled ahead of use.
unused_workspace_dependencies = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "warn"
# pedantic noise we accept:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"   # enforce via review; rustdoc `# Errors` sections are expected on public fallible fns
missing_panics_doc = "warn"

# ───────────────────────── profiles ─────────────────────────
[profile.dev]
opt-level = 1                    # terminal parsing in debug is unusably slow at 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "unwind"                 # session-level isolation with catch_unwind (docs/02 §10)
incremental = false

[profile.release-debug]          # profiling: keeps symbols
inherits = "release"
strip = "none"
debug = "line-tables-only"

[profile.bench]
inherits = "release"
debug = "line-tables-only"
strip = "none"
