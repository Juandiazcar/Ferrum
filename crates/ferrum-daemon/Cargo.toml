[package]
name = "ferrum-daemon"
description = "session manager, event loop, client server and layout persistence (library behind the ferrumd binary)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "ferrum_daemon"

[[bin]]
name = "ferrumd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
ferrum-config = { workspace = true }
ferrum-platform = { workspace = true }
ferrum-project = { workspace = true }
ferrum-proto = { workspace = true }
ferrum-pty = { workspace = true }
ferrum-scrollback = { workspace = true }
ferrum-vt = { workspace = true }
mio = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = { workspace = true }

[dev-dependencies]
ferrum-testkit = { workspace = true }
