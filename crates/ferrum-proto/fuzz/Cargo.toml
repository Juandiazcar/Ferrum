[package]
name = "ferrum-proto-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets of ferrum-proto (not part of the product workspace)"

[package.metadata]
cargo-fuzz = true

# Used by `tests/support/fuzz_body.rs`, which the target includes with `#[path]`.
[package.metadata.cargo-machete]
ignored = ["ferrum-proto"]

[dependencies]
libfuzzer-sys = { version = "0.4.13", default-features = false, features = ["link_libfuzzer"] }
ferrum-proto = { path = "..", version = "0.1.0" }

# A workspace of its own: the fuzz crate needs a nightly toolchain and sanitizers, and must not
# change the product lockfile.
[workspace]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false
