[package]
name = "ferrum-vt-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets of ferrum-vt (not part of the product workspace)"

[package.metadata]
cargo-fuzz = true

# Both crates are used by `tests/support/fuzz_body.rs`, which the target includes with `#[path]`.
[package.metadata.cargo-machete]
ignored = ["ferrum-scrollback", "ferrum-vt"]

[dependencies]
libfuzzer-sys = { version = "0.4.13", default-features = false, features = ["link_libfuzzer"] }
ferrum-scrollback = { path = "../../ferrum-scrollback" }
ferrum-vt = { path = ".." }

# A workspace of its own: the fuzz crate needs a nightly toolchain and sanitizers, and must not
# change the product lockfile.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
