# CI — runs on every PR and push to main (docs/06 §6).
# WP-00: replace every `<SHA> # vX` with the commit SHA of the CURRENT latest release of that action
# (resolve with `gh api repos/<owner>/<repo>/releases/latest`). Versions are intentionally not
# hard-coded here because they could not be verified when the spec was written.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,72}$' \
            || { echo "PR title must be a Conventional Commit (docs/06 §2)"; exit 1; }

  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<SHA> # vX
      - uses: dtolnay/rust-toolchain@<SHA> # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@<SHA> # vX
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@<SHA> # vX
      - uses: dtolnay/rust-toolchain@<SHA>
      - uses: Swatinem/rust-cache@<SHA> # vX
      - uses: taiki-e/install-action@<SHA> # vX
        with:
          tool: nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo test --workspace --doc --locked

  deny-and-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<SHA> # vX
      - uses: dtolnay/rust-toolchain@<SHA>
      - uses: taiki-e/install-action@<SHA> # vX
        with:
          tool: cargo-deny,typos-cli,cargo-machete
      - run: cargo deny check
      - run: cargo xtask check-deps
      - run: typos
      - run: cargo machete

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@<SHA> # vX
      - uses: dtolnay/rust-toolchain@<SHA>
      - uses: Swatinem/rust-cache@<SHA> # vX
      - run: cargo doc --workspace --no-deps --locked

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<SHA> # vX
      - uses: dtolnay/rust-toolchain@<SHA>
      - uses: taiki-e/install-action@<SHA> # vX
        with:
          tool: cargo-hack
      - run: cargo hack check --workspace --each-feature --no-dev-deps --locked

  memcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<SHA> # vX
      - uses: dtolnay/rust-toolchain@<SHA>
      - uses: Swatinem/rust-cache@<SHA> # vX
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: cargo build --release --locked
      - run: xvfb-run -a cargo xtask memcheck --ci   # gate: combined PSS < 50 MB (docs/03)
      - uses: actions/upload-artifact@<SHA> # vX
        if: always()
        with:
          name: memcheck-report
          path: target/memcheck/*.json
