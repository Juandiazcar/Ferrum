# cargo-deny policy. Schema evolves: run `cargo deny init` with the installed version (0.22.x at
# spec time) and reconcile this file in WP-00.

[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
yanked = "deny"
ignore = []                      # every ignore needs a comment + expiry date

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "CC0-1.0", "MPL-2.0", "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "openssl" },
  { crate = "openssl-sys" },
  { crate = "native-tls" },
  # v1.0 has no async runtime; lifting these needs ADR (docs/13 §7)
  { crate = "tokio" },
  { crate = "async-std" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
