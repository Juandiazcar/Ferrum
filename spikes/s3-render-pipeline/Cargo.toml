# Spike S3 (docs/12): render pipeline measurements. Throwaway, standalone: its own workspace and
# lockfile so it never enters the product workspace, CI or cargo-deny (root `exclude = ["spikes"]`).
[package]
name = "ferrum-spike-s3"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
skia = ["dep:tiny-skia"]
dialog = ["dep:rfd"]

[dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "wayland"] }
swash = "0.2.10"
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs", "memmap"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"], optional = true }
rfd = { version = "0.18.0", optional = true }

# Same lint policy as the product workspace (docs/05 §11), including `unsafe_code = "forbid"`:
# memory is measured externally on Windows/macOS instead of through OS calls.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
let_underscore_drop = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "unwind"
incremental = false
