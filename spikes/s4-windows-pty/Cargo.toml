# Throwaway spike S4 (docs/12): exercises portable-pty / ConPTY. Standalone package with its own
# [workspace] and Cargo.lock, excluded from the product workspace (root `exclude = ["spikes"]`).
# Results live in docs/adr/0026; this code may be deleted once WP-05 lands.
[package]
name = "s4-windows-pty"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false
description = "Throwaway spike S4: portable-pty and ConPTY behavior harness"

[workspace]

[dependencies]
# Versions verified on crates.io 2026-11-21; both are listed in docs/07 (anyhow 1.0.104 mirrors the
# root workspace pin; portable-pty 0.9.0 is the latest stable).
portable-pty = "=0.9.0"
anyhow = "1.0.104"

# Same lint policy as the product workspace (docs/05 §11), including `unsafe_code = "forbid"`.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
let_underscore_drop = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "warn"
