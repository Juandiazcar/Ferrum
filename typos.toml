# typos-cli configuration (docs/04 §1). Keep exclusions minimal and justified.
[files]
extend-exclude = [
  "LICENSE-APACHE",   # verbatim third-party legal text
  "LICENSE-MIT",
  "Cargo.lock",
  "assets/",          # brand assets and, later, fonts and generated files
  "crates/*/fuzz/corpus/",  # raw bytes of terminal sessions and fixtures
  "*.in",  # raw bytes of fixtures
  "fixtures/vt/alacritty/", # recordings of real shells (third-party, byte exact)
  "fixtures/unicode/", # official Unicode data files, committed unmodified
]

[default.extend-words]
# Terminal vocabulary that looks like a typo (add entries only with a reason).
ba = "ba"   # a byte in the hex annotations of fixtures/vt/**/*.md (0xBA)
